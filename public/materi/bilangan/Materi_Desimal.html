    <script>
        const AudioFX = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            },
            playClick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            },
            playCorrect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            },
            playWrong() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        };

        // FUNGSI UNTUK TABEL NILAI TEMPAT INTERAKTIF
        function updateTabelNilaiTempat() {
            const inputElem = document.getElementById('input-angka');
            if (!inputElem) return;

            const rawInput = inputElem.value.trim();
            const container = document.getElementById('container-nilai-tempat');
            const labelCaraBaca = document.getElementById('cara-baca');
            const labelAngkaAsli = document.getElementById('label-angka-asli');

            if (!container || !labelCaraBaca || !labelAngkaAsli) return;

            labelAngkaAsli.innerText = rawInput || "0";
            container.innerHTML = "";

            if (!rawInput) {
                labelCaraBaca.innerText = "-";
                return;
            }

            const normalizedInput = rawInput.replace(',', '.');
            const parts = normalizedInput.split('.');
            const integerPart = parts[0] || "";
            const decimalPart = parts[1] !== undefined ? parts[1] : null;

            const intNames = ["Satuan", "Puluhan", "Ratusan", "Ribuan", "Puluh Ribuan"];
            const intValues = ["1", "10", "100", "1.000", "10.000"];
            const decNames = ["Persepuluhan", "Perseratusan", "Perseribuan"];
            const decValues = ["1/10 (0,1)", "1/100 (0,01)", "1/1000 (0,001)"];

            let cards = [];

            const intLen = integerPart.length;
            for (let i = 0; i < intLen; i++) {
                const char = integerPart[i];
                const positionFromRight = intLen - 1 - i;
                const name = intNames[positionFromRight] || `10^${positionFromRight}`;
                const val = intValues[positionFromRight] || "";

                cards.push(`
                    <div class="bg-white border border-sky-200 rounded-2xl p-3 w-24 text-center shadow-sm">
                        <div class="text-xs font-bold text-slate-700">${name}</div>
                        <div class="text-[10px] text-slate-400 mb-2">${val}</div>
                        <div class="text-2xl font-bold text-sky-500">${char}</div>
                    </div>
                `);
            }

            if (decimalPart !== null) {
                cards.push(`
                    <div class="bg-amber-100 border border-amber-300 rounded-2xl p-3 w-16 text-center flex items-center justify-center shadow-sm">
                        <div class="text-3xl font-bold text-amber-600 font-serif">,</div>
                    </div>
                `);

                for (let i = 0; i < decimalPart.length; i++) {
                    const char = decimalPart[i];
                    const name = decNames[i] || `1/${Math.pow(10, i + 1)}`;
                    const val = decValues[i] || "";

                    cards.push(`
                        <div class="bg-white border border-purple-200 rounded-2xl p-3 w-28 text-center shadow-sm">
                            <div class="text-xs font-bold text-purple-700">${name}</div>
                            <div class="text-[10px] text-slate-400 mb-2">${val}</div>
                            <div class="text-2xl font-bold text-purple-600">${char}</div>
                        </div>
                    `);
                }
            }

            container.innerHTML = cards.join('');
            labelCaraBaca.innerText = terbilangSimpel(integerPart, decimalPart);
        }
        window.updateTabelNilaiTempat = updateTabelNilaiTempat;

        function terbilangSimpel(intPart, decPart) {
            const kata = ["nol", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan"];
            
            function readInt(n) {
                let num = parseInt(n, 10);
                if (isNaN(num) || num === 0) return "nol";
                let res = "";
                if (num >= 100) {
                    let r = Math.floor(num / 100);
                    res += (r === 1 ? "seratus" : kata[r] + " ratus") + " ";
                    num %= 100;
                }
                if (num >= 20) {
                    res += kata[Math.floor(num / 10)] + " puluh ";
                    num %= 10;
                } else if (num >= 10) {
                    if (num === 10) res += "sepuluh ";
                    else if (num === 11) res += "sebelas ";
                    else res += kata[num % 10] + " belas ";
                    num = 0;
                }
                if (num > 0) res += kata[num] + " ";
                return res.trim();
            }

            let hasil = readInt(intPart);
            
            if (decPart !== null && decPart.length > 0) {
                hasil += " koma";
                for (let char of decPart) {
                    if (!isNaN(parseInt(char))) {
                        hasil += " " + kata[parseInt(char)];
                    }
                }
            }
            return hasil.charAt(0).toUpperCase() + hasil.slice(1);
        }

        function updateComparisonWidget() {
            const val1Input = document.getElementById('cmp-val-1');
            const val2Input = document.getElementById('cmp-val-2');
            const symbolElem = document.getElementById('cmp-symbol');
            const expElem = document.getElementById('cmp-explanation');
            if (!val1Input || !val2Input) return;

            const v1 = parseFloat(val1Input.value) || 0;
            const v2 = parseFloat(val2Input.value) || 0;

            if (v1 > v2) {
                symbolElem.innerText = '>';
                symbolElem.className = "w-14 h-14 rounded-2xl bg-emerald-500 text-white flex items-center justify-center text-2xl font-black shadow-md shadow-emerald-200";
                expElem.innerText = currentLang === 'en' ? `Explanation: ${v1} is greater than ${v2}.` : `Penjelasan: ${v1} lebih besar dari ${v2}.`;

                symbolElem.innerText = '<';

                        ${isSuccess ? i18n[currentLang].correctTitle : i18n[currentLang].wrongTitle}
                    </h3>
                    <p class="text-sm font-semibold text-slate-600">${message}</p>
                    <button onclick="closeModalAndNext(this)" class="w-full py-3 rounded-xl ${isSuccess ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-slate-700 hover:bg-slate-800'} text-white font-bold transition">
                        ${i18n[currentLang].btnNextQ}
                    </button>
                </div>`;
            document.body.appendChild(modal);
        }

        function closeModalAndNext(btn) {
            AudioFX.playClick();
            const modal = btn.closest('.fixed');
            if (modal) modal.remove();

            if (currentGameMode === 6) {
                selectGameMode(Math.floor(Math.random() * 6));
            } else {
                generateGameQuestion();
            }
        }

        window.onload = function() {
            renderCurrentSlide();
        };
    </script>
</body>
</html>
