    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .fraction-math {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
        }
        .fraction-num {
            border-bottom: 2px solid currentColor;
            padding-bottom: 2px;
            font-weight: bold;
        }
        .fraction-den {
            padding-top: 2px;
            font-weight: bold;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

                <div>
                    <span class="font-extrabold text-xl bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent" x-text="lang === 'id' ? 'DuniaPecahan' : 'FractionWorld'"></span>
                    <span class="hidden sm:inline-block text-xs text-slate-500 font-medium ml-2 px-2 py-0.5 bg-slate-100 rounded-full" x-text="lang === 'id' ? 'Modul Interaktif' : 'Interactive Module'"></span>
                </div>
            </div>

            <!-- Tombol Kembali (Icon + Teks) -->
<a href="../../pages/bilangan.html" 
   class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-sky-100 text-slate-700 hover:text-sky-600 font-semibold text-xs flex items-center gap-2 transition border border-slate-200">
    <i class="fa-solid fa-house text-sm text-sky-600"></i>
    <span class="hidden sm:inline" x-text="lang === 'id' ? 'Beranda' : 'Home'"></span>
</a>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center space-x-1 font-semibold text-slate-600 text-sm">
                <a href="#pengenalan" class="px-3 py-2 rounded-lg hover:text-sky-600 hover:bg-sky-50 transition" x-text="lang === 'id' ? 'Konsep Dasar' : 'Basic Concepts'"></a>
                <a href="#jenis" class="px-3 py-2 rounded-lg hover:text-sky-600 hover:bg-sky-50 transition" x-text="lang === 'id' ? 'Jenis Pecahan' : 'Fraction Types'"></a>
                <a href="#perbandingan" class="px-3 py-2 rounded-lg hover:text-sky-600 hover:bg-sky-50 transition" x-text="lang === 'id' ? 'Perbandingan' : 'Comparison'"></a>
                <a href="#operasi" class="px-3 py-2 rounded-lg hover:text-sky-600 hover:bg-sky-50 transition" x-text="lang === 'id' ? 'Operasi Hitung' : 'Operations'"></a>
                <a href="#kuis" class="px-3 py-2 bg-sky-600 text-white rounded-lg hover:bg-sky-700 transition shadow-sm ml-2" x-text="lang === 'id' ? 'Kuis Akhir' : 'Final Quiz'"></a>
                
                <!-- Language Switcher Button -->

                    <i class="fa-solid fa-globe text-sky-600"></i>
                    <span x-text="lang === 'id' ? '🇮🇩 ID' : '🇬🇧 EN'"></span>

            <!-- Mobile Menu & Lang Toggle -->
            <div class="flex items-center space-x-2 md:hidden">

                    <i class="fa-solid fa-globe text-sky-600"></i>
                    <span x-text="lang === 'id' ? 'ID' : 'EN'"></span>
                </button>
                <button @click="mobileMenu = !mobileMenu" class="text-slate-600 hover:text-slate-900 p-2">
                    <i class="fa-solid" :class="mobileMenu ? 'fa-xmark text-xl' : 'fa-bars text-xl'"></i>
                </button>
            </div>

            <a href="#pengenalan" @click="mobileMenu = false" class="block px-3 py-2 rounded-lg text-slate-700 hover:bg-sky-50" x-text="lang === 'id' ? 'Konsep Dasar' : 'Basic Concepts'"></a>
            <a href="#jenis" @click="mobileMenu = false" class="block px-3 py-2 rounded-lg text-slate-700 hover:bg-sky-50" x-text="lang === 'id' ? 'Jenis Pecahan' : 'Fraction Types'"></a>
            <a href="#perbandingan" @click="mobileMenu = false" class="block px-3 py-2 rounded-lg text-slate-700 hover:bg-sky-50" x-text="lang === 'id' ? 'Perbandingan' : 'Comparison'"></a>
            <a href="#operasi" @click="mobileMenu = false" class="block px-3 py-2 rounded-lg text-slate-700 hover:bg-sky-50" x-text="lang === 'id' ? 'Operasi Hitung' : 'Operations'"></a>
            <a href="#kuis" @click="mobileMenu = false" class="block px-3 py-2 bg-sky-600 text-white rounded-lg text-center" x-text="lang === 'id' ? 'Kuis Akhir' : 'Final Quiz'"></a>
        </div>
    </header>

    <main class="flex-grow">
        <section class="relative bg-gradient-to-b from-sky-50 via-white to-slate-50 py-12 md:py-16 overflow-hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="grid md:grid-cols-2 gap-12 items-center">
                    <div>
                        <div class="inline-flex items-center space-x-2 bg-sky-100 text-sky-700 font-semibold px-3 py-1 rounded-full text-xs mb-4">
                            <i class="fa-solid fa-sparkles"></i>
                            <span x-text="lang === 'id' ? 'Belajar Matematika Interaktif & Visual!' : 'Interactive & Visual Math Learning!'"></span>
                        </div>
                        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 leading-tight tracking-tight">
                            <span x-text="lang === 'id' ? 'Pahami' : 'Master'"></span> <span class="bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent" x-text="lang === 'id' ? 'Konsep Pecahan' : 'Fractions Concepts'"></span> <span x-text="lang === 'id' ? 'Secara Lengkap & Latihan Mandiri' : 'With Interactive Practice'"></span>
                        </h1>
                        <p class="mt-4 text-base sm:text-lg text-slate-600 leading-relaxed" x-text="lang === 'id' ? 'Pelajari bentuk pecahan, konversi desimal/persen, cara membandingkan, operasi (+, -, ×, ÷) lengkap dengan LATIHAN SOAL di setiap sub-materi!' : 'Explore fraction forms, decimal/percentage conversions, comparison techniques, operations (+, -, ×, ÷), and topic-by-topic PRACTICE EXERCISES!'">
                        </p>
                        <div class="mt-8 flex flex-wrap gap-4">
                            <a href="#pengenalan" class="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg shadow-sky-500/20 transition duration-200 flex items-center space-x-2">
                                <span x-text="lang === 'id' ? 'Mulai Belajar' : 'Start Learning'"></span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </a>
                            <a href="#kuis" class="px-6 py-3 bg-white hover:bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-300 transition duration-200 flex items-center space-x-2">
                                <i class="fa-solid fa-gamepad text-sky-600"></i>
                                <span x-text="lang === 'id' ? 'Kuis Evaluasi' : 'Comprehensive Quiz'"></span>
                            </a>
                        </div>
                    </div>

                    <!-- Quick Visualizer Sandbox -->
                    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i class="fa-solid fa-eye text-sky-500"></i>
                                <span x-text="lang === 'id' ? 'Visualisator Pecahan' : 'Fraction Visualizer'"></span>
                            </h3>
                            <span class="text-xs bg-sky-100 text-sky-700 px-2.5 py-1 rounded-full font-medium" x-text="lang === 'id' ? 'Ubah Slider' : 'Slide Controls'"></span>
                        </div>

                        <div class="flex flex-col sm:flex-row items-center justify-around gap-6 py-4">
                            <div class="relative w-40 h-40 flex items-center justify-center">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path class="text-slate-100" stroke-width="3.8" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="text-sky-500 transition-all duration-300" 
                                          :stroke-dasharray="`${(heroNum / heroDen) * 100}, 100`" 
                                          stroke-width="3.8" 
                                          stroke-linecap="round" 
                                          stroke="currentColor" 
                                          fill="none" 
                                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center font-bold text-slate-800">
                                    <span class="text-2xl text-sky-600" x-text="heroNum"></span>
                                    <div class="w-8 h-0.5 bg-slate-800 my-0.5"></div>
                                    <span class="text-2xl" x-text="heroDen"></span>
                                </div>
                            </div>

                            <div class="space-y-4 w-full sm:w-1/2">
                                <div>
                                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                                        <span x-text="lang === 'id' ? 'Pembilang (Numerator)' : 'Numerator (Top)'"></span>
                                        <span class="text-sky-600 font-bold" x-text="heroNum"></span>
                                    </div>
                                    <input type="range" min="1" :max="heroDen" x-model.number="heroNum" class="w-full accent-sky-600 cursor-pointer">
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                                        <span x-text="lang === 'id' ? 'Penyebut (Denominator)' : 'Denominator (Bottom)'"></span>
                                        <span class="text-sky-600 font-bold" x-text="heroDen"></span>
                                    </div>
                                    <input type="range" min="2" max="12" x-model.number="heroDen" @input="if(heroNum > heroDen) heroNum = heroDen" class="w-full accent-sky-600 cursor-pointer">
                                </div>
                                <div class="p-3 bg-slate-50 rounded-xl text-xs space-y-1">
                                    <div class="flex justify-between">
                                        <span class="text-slate-500" x-text="lang === 'id' ? 'Desimal:' : 'Decimal:'"></span>
                                        <span class="font-bold text-slate-800" x-text="(heroNum / heroDen).toFixed(2)"></span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-500" x-text="lang === 'id' ? 'Persen:' : 'Percentage:'"></span>
                                        <span class="font-bold text-emerald-600" x-text="Math.round((heroNum / heroDen) * 100) + '%'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="pengenalan" class="py-16 bg-white border-t border-slate-100">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center max-w-3xl mx-auto mb-12">
                    <span class="text-sky-600 font-bold uppercase tracking-wider text-xs" x-text="lang === 'id' ? 'Materi 1' : 'Topic 1'"></span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1" x-text="lang === 'id' ? 'Apa Itu Pecahan?' : 'What is a Fraction?'"></h2>
                    <p class="text-slate-600 mt-2" x-text="lang === 'id' ? 'Pecahan adalah bagian dari keseluruhan benda yang utuh atau sekelompok benda.' : 'A fraction represents a numerical part of a whole or a set of objects.'"></p>
                </div>

                <div class="grid md:grid-cols-2 gap-8 items-center">
                    <!-- Anatomy Card -->
                    <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-8 rounded-3xl shadow-xl">
                        <h3 class="text-xl font-bold mb-4 text-sky-300 flex items-center gap-2">
                            <i class="fa-solid fa-shapes"></i>
                            <span x-text="lang === 'id' ? 'Struktur Pecahan' : 'Fraction Structure'"></span>
                        </h3>
                        <p class="text-slate-300 text-sm mb-6" x-text="lang === 'id' ? 'Pecahan terdiri dari dua angka yang dipisahkan garis horizontal:' : 'A fraction consists of two numbers separated by a horizontal bar:'"></p>

                        <div class="flex items-center justify-center my-6">
                            <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/10 flex items-center gap-8">
                                <div class="text-center">
                                    <div class="text-4xl font-extrabold text-sky-400">a</div>
                                    <div class="w-16 h-1 bg-white my-2 rounded-full"></div>
                                    <div class="text-4xl font-extrabold text-emerald-400">b</div>
                                </div>
                                <div class="space-y-4 text-sm">
                                    <div class="flex items-center gap-3">
                                        <div class="w-3 h-3 rounded-full bg-sky-400"></div>
                                        <div>
                                            <p class="font-bold text-sky-400" x-text="lang === 'id' ? 'a = Pembilang' : 'a = Numerator'"></p>
                                            <p class="text-xs text-slate-300" x-text="lang === 'id' ? 'Berapa bagian yang diambil.' : 'How many parts are taken.'"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
                                        <div>
                                            <p class="font-bold text-emerald-400" x-text="lang === 'id' ? 'b = Penyebut' : 'b = Denominator'"></p>
                                            <p class="text-xs text-slate-300" x-text="lang === 'id' ? 'Total bagian utuh yang sama (b ≠ 0).' : 'Total equal parts of the whole (b ≠ 0).'"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 bg-white/5 rounded-xl border border-white/10 text-xs text-slate-300">
                            <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>
                            <strong x-text="lang === 'id' ? 'Catatan:' : 'Note:'"></strong> 
                            <span x-text="lang === 'id' ? 'Penyebut tidak boleh 0 karena pembagian dengan 0 tidak terdefinisi!' : 'Denominator cannot be 0 because division by 0 is undefined!'"></span>
                        </div>
                    </div>

                    <!-- Real World Analogy -->
                    <div class="space-y-6">
                        <div class="bg-sky-50 border border-sky-100 p-6 rounded-2xl">
                            <h4 class="font-bold text-slate-800 text-base mb-2 flex items-center gap-2">
                                <i class="fa-solid fa-pizza-slice text-amber-500"></i>
                                <span x-text="lang === 'id' ? 'Ilustrasi Pizza' : 'Pizza Illustration'"></span>
                            </h4>
                            <p class="text-slate-600 text-sm leading-relaxed" x-text="lang === 'id' ? 'Bayangkan 1 pizza utuh dipotong menjadi 8 bagian sama besar.' : 'Imagine 1 whole pizza divided into 8 equal slices.'"></p>
                            <ul class="mt-3 space-y-2 text-sm text-slate-700">
                                <li class="flex items-center gap-2">
                                    <i class="fa-solid fa-check text-sky-600 text-xs"></i>
                                    <span x-html="lang === 'id' ? 'Makan 3 potong = <span class=\'fraction-math\'><span class=\'fraction-num\'>3</span><span class=\'fraction-den\'>8</span></span> bagian pizza.' : 'Eating 3 slices = <span class=\'fraction-math\'><span class=\'fraction-num\'>3</span><span class=\'fraction-den\'>8</span></span> of the pizza.'"></span>
                                </li>
                                <li class="flex items-center gap-2">
                                    <i class="fa-solid fa-check text-sky-600 text-xs"></i>
                                    <span x-html="lang === 'id' ? 'Sisa pizza = <span class=\'fraction-math\'><span class=\'fraction-num\'>5</span><span class=\'fraction-den\'>8</span></span> bagian.' : 'Remaining pizza = <span class=\'fraction-math\'><span class=\'fraction-num\'>5</span><span class=\'fraction-den\'>8</span></span> of the pizza.'"></span>
                                </li>
                            </ul>
                        </div>

                        <!-- Mini Chocolate Interactive Bar -->
                        <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-slate-800 text-sm mb-3" x-text="lang === 'id' ? 'Cobalah Potong Cokelat Ini!' : 'Try Slicing This Chocolate Bar!'"></h4>
                            <div class="flex items-center gap-2 mb-3">
                                <template x-for="i in 6" :key="i">
                                    <button @click="chocolateSlices = i" 
                                            :class="i <= chocolateSlices ? 'bg-amber-800 text-amber-100 border-amber-900' : 'bg-slate-100 text-slate-400 border-slate-200'"
                                            class="flex-1 h-12 rounded-lg border-2 font-bold text-xs flex items-center justify-center transition">
                                        <span x-text="i"></span>
                                    </button>
                                </template>
                            </div>
                            <p class="text-xs text-slate-500 text-center">
                                <span x-text="lang === 'id' ? 'Kamu memilih ' : 'You selected '"></span>
                                <strong class="text-amber-800" x-text="chocolateSlices"></strong>
                                <span x-text="lang === 'id' ? ' dari 6 potong = ' : ' out of 6 slices = '"></span>
                                <span class="font-bold text-slate-800" x-text="chocolateSlices + '/6'"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- SUB-TOPIC 1 PRACTICE EXERCISE WIDGET -->
                <div class="mt-10 bg-sky-50 border-2 border-sky-200 rounded-3xl p-6 sm:p-8 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-3 py-1 bg-sky-600 text-white font-bold text-xs rounded-full uppercase tracking-wider" x-text="lang === 'id' ? 'Latihan Sub-Materi 1' : 'Sub-Topic 1 Practice'"></span>
                        <span class="text-xs text-sky-800 font-semibold" x-text="`Score: ${sub1Score}/3`"></span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2" x-text="lang === 'id' ? 'Kuis Cepat: Mengenal Pembilang & Penyebut' : 'Quick Quiz: Numerator & Denominator'"></h3>
                    
                    <div class="bg-white p-5 rounded-2xl border border-sky-100 mt-4">
                        <p class="text-sm font-semibold text-slate-800 mb-4" x-text="sub1Questions[sub1Index][lang].question"></p>
                        
                        <div class="grid sm:grid-cols-2 gap-3 mb-4">
                            <template x-for="(opt, idx) in sub1Questions[sub1Index][lang].options" :key="idx">
                                <button @click="answerSub1(idx)"
                                        :disabled="sub1Answered"
                                        :class="{
                                            'bg-slate-50 border-slate-200 text-slate-700 hover:bg-sky-100': !sub1Answered,
                                            'bg-emerald-100 border-emerald-500 text-emerald-800 font-bold': sub1Answered && idx === sub1Questions[sub1Index].answer,
                                            'bg-rose-100 border-rose-500 text-rose-800': sub1Answered && sub1Selected === idx && idx !== sub1Questions[sub1Index].answer,
                                            'bg-slate-50 border-slate-200 opacity-50': sub1Answered && idx !== sub1Questions[sub1Index].answer && sub1Selected !== idx
                                        }"
                                        class="p-3 rounded-xl border text-left text-xs sm:text-sm transition font-medium">
                                    <span x-text="opt"></span>
                                </button>
                            </template>
                        </div>

                        <div x-show="sub1Answered" class="p-3 rounded-xl bg-slate-100 text-xs text-slate-700 mb-3" x-text="sub1Questions[sub1Index][lang].explanation"></div>

                        <button x-show="sub1Answered" @click="nextSub1()" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-lg transition">
                            <span x-text="sub1Index < sub1Questions.length - 1 ? (lang === 'id' ? 'Soal Berikutnya' : 'Next Question') : (lang === 'id' ? 'Ulangi Latihan' : 'Restart Practice')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="jenis" class="py-16 bg-slate-50 border-t border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center max-w-3xl mx-auto mb-12">
                    <span class="text-sky-600 font-bold uppercase tracking-wider text-xs" x-text="lang === 'id' ? 'Materi 2' : 'Topic 2'"></span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1" x-text="lang === 'id' ? 'Jenis-Jenis Pecahan' : 'Types of Fractions'"></h2>
                    <p class="text-slate-600 mt-2" x-text="lang === 'id' ? 'Pecahan hadir dalam beberapa bentuk sesuai dengan cara penulisan dan nilainya.' : 'Fractions exist in various forms depending on how they are written and valued.'"></p>
                </div>

                <!-- Grid 4 Types -->
                <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <!-- Type 1: Pecahan Biasa -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                        <div class="w-12 h-12 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center font-bold text-xl mb-4">1</div>
                        <h3 class="font-bold text-slate-800 text-lg mb-2" x-text="lang === 'id' ? 'Pecahan Biasa' : 'Proper / Improper'"></h3>
                        <p class="text-slate-600 text-xs leading-relaxed mb-4" x-text="lang === 'id' ? 'Terdiri dari pembilang & penyebut. Murni (a < b) atau Tidak Murni (a ≥ b).' : 'Consists of numerator & denominator. Proper (a < b) or Improper (a ≥ b).'"></p>
                        <div class="p-3 bg-sky-50 rounded-xl text-xs space-y-2">
                            <div>

                // Helpers
                getMixedFraction(n, d) {
                    if (d === 0) return this.lang === 'id' ? 'Tidak terdefinisi' : 'Undefined';
                    if (n < d) return this.lang === 'id' ? 'Hanya Pecahan Murni' : 'Proper Fraction Only';
                    const whole = Math.floor(n / d);
                    const remainder = n % d;
                    return remainder === 0 ? `${whole}` : `${whole} (${remainder}/${d})`;
                },

                gcd(a, b) {
                    return b === 0 ? Math.abs(a) : this.gcd(b, a % b);
                },

                calculateFractionResult() {
                    const n1 = this.calcNum1, d1 = this.calcDen1;
                    const n2 = this.calcNum2, d2 = this.calcDen2;
                    let resNum, resDen, steps = '';

                    if (!d1 || !d2) return { num: 'Err', den: 'Err', steps: this.lang === 'id' ? 'Penyebut tidak boleh 0' : 'Denominator cannot be 0' };

                    if (this.calcOp === '+') {
                        resNum = (n1 * d2) + (n2 * d1);
                        resDen = d1 * d2;
                        steps = this.lang === 'id' 
                            ? `Samakan penyebut: (${n1}×${d2})/${resDen} + (${n2}×${d1})/${resDen} = ${resNum}/${resDen}`
                            : `Equalize denominators: (${n1}×${d2})/${resDen} + (${n2}×${d1})/${resDen} = ${resNum}/${resDen}`;
                    } else if (this.calcOp === '-') {
                        resNum = (n1 * d2) - (n2 * d1);
                        resDen = d1 * d2;
                        steps = this.lang === 'id'
                            ? `Samakan penyebut: (${n1}×${d2})/${resDen} - (${n2}×${d1})/${resDen} = ${resNum}/${resDen}`
                            : `Equalize denominators: (${n1}×${d2})/${resDen} - (${n2}×${d1})/${resDen} = ${resNum}/${resDen}`;
                    } else if (this.calcOp === '*') {
                        resNum = n1 * n2;
                        resDen = d1 * d2;
                        steps = this.lang === 'id'
                            ? `Kalikan pembilang dengan pembilang (${n1}×${n2}) dan penyebut dengan penyebut (${d1}×${d2}) = ${resNum}/${resDen}`
                            : `Multiply numerators (${n1}×${n2}) and denominators (${d1}×${d2}) = ${resNum}/${resDen}`;
                    } else if (this.calcOp === '/') {
                        resNum = n1 * d2;
                        resDen = d1 * n2;
                        steps = this.lang === 'id'
                            ? `Ubah pembagian menjadi perkalian dengan membalik pecahan kedua: (${n1}/${d1}) × (${d2}/${n2}) = ${resNum}/${resDen}`
                            : `Convert division to multiplication by taking the reciprocal: (${n1}/${d1}) × (${d2}/${n2}) = ${resNum}/${resDen}`;
                    }

                    const divisor = this.gcd(resNum, resDen);
                    const simplifiedNum = resNum / divisor;
                    const simplifiedDen = resDen / divisor;

                    if (divisor > 1) {
                        steps += this.lang === 'id' 
                            ? `<br>Disederhanakan (dibagi ${divisor}): <strong>${simplifiedNum}/${simplifiedDen}</strong>`
                            : `<br>Simplified (divided by ${divisor}): <strong>${simplifiedNum}/${simplifiedDen}</strong>`;
                    }

                    return { num: simplifiedNum, den: simplifiedDen, steps: steps };
                },
